<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <defs>
    <linearGradient id="talkGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- TalkON Text -->
  <g transform="translate(20, 55)">
    <!-- Talk text -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="56" font-weight="700" fill="url(#talkGradient)" letter-spacing="-1">Talk</text>
    
    <!-- ON text with green accent -->
    <text x="130" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="56" font-weight="800" fill="#00CC88" letter-spacing="-1">ON</text>
    
    <!-- Small online indicator next to text -->
    <circle cx="220" y="-30" r="8" fill="#FF9500"/>
  </g>
</svg>