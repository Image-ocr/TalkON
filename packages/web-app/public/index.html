<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TalkON - Modern, secure messaging platform with end-to-end encryption" />
    <meta name="theme-color" content="#0066FF" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Safari Pinned Tab -->
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#0066FF" />
    
    <!-- MS Tile -->
    <meta name="msapplication-TileColor" content="#0066FF" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TalkON - Secure Messaging" />
    <meta property="og:description" content="Modern, secure, and scalable messaging platform with end-to-end encryption" />
    <meta property="og:image" content="/og-image.png" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TalkON - Secure Messaging" />
    <meta name="twitter:description" content="Modern, secure, and scalable messaging platform with end-to-end encryption" />
    <meta name="twitter:image" content="/og-image.png" />
    
    <title>TalkON - Secure Messaging</title>
    
    <!-- Preconnect to CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <style>
      /* Critical CSS for initial render */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
      
      #root {
        min-height: 100vh;
      }
      
      /* Loading state */
      .loading-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #f5f5f7 0%, #ffffff 100%);
      }
      
      .loading-screen.dark {
        background: linear-gradient(135deg, #1a1a2e 0%, #242438 100%);
      }
      
      .loading-spinner {
        width: 48px;
        height: 48px;
        border: 3px solid rgba(0, 102, 255, 0.1);
        border-top-color: #0066FF;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Loading state shown until React hydrates -->
      <div class="loading-screen" id="loading-screen">
        <svg width="80" height="80" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="bubbleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#0066FF" />
              <stop offset="100%" stop-color="#00D4FF" />
            </linearGradient>
          </defs>
          <g transform="translate(10, 8)">
            <path d="M40 0C17.9 0 0 17.9 0 40c0 7.5 2.1 14.5 5.8 20.5L2 72l14.5-3.5C23.5 73.5 31.3 76 40 76c22.1 0 40-17.9 40-40S62.1 0 40 0z" fill="url(#bubbleGradient)"/>
            <circle cx="28" cy="42" r="4" fill="white"/>
            <circle cx="40" cy="42" r="4" fill="white"/>
            <circle cx="52" cy="42" r="4" fill="white"/>
            <circle cx="70" cy="65" r="10" fill="#00CC88" stroke="white" stroke-width="3"/>
          </g>
        </svg>
        <div class="loading-spinner" style="margin-top: 24px;"></div>
      </div>
    </div>
    
    <script>
      // Check for dark mode preference
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.getElementById('loading-screen').classList.add('dark');
      }
      
      // Listen for changes
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
        if (event.matches) {
          document.getElementById('loading-screen').classList.add('dark');
        } else {
          document.getElementById('loading-screen').classList.remove('dark');
        }
      });
    </script>
  </body>
</html>
