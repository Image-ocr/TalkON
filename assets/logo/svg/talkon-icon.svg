<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bubbleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0066FF" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Chat Bubble Icon -->
  <g transform="translate(10, 8)">
    <!-- Main bubble shape -->
    <path d="M40 0C17.9 0 0 17.9 0 40c0 7.5 2.1 14.5 5.8 20.5L2 72l14.5-3.5C23.5 73.5 31.3 76 40 76c22.1 0 40-17.9 40-40S62.1 0 40 0z" 
          fill="url(#bubbleGradient)" filter="url(#shadow)"/>
    
    <!-- Inner highlight -->
    <ellipse cx="28" cy="28" rx="12" ry="8" fill="white" opacity="0.3"/>
    
    <!-- Three dots for messaging -->
    <circle cx="28" cy="42" r="4" fill="white"/>
    <circle cx="40" cy="42" r="4" fill="white"/>
    <circle cx="52" cy="42" r="4" fill="white"/>
    
    <!-- Online indicator dot -->
    <circle cx="70" cy="65" r="10" fill="#00CC88" stroke="white" stroke-width="3"/>
  </g>
</svg>